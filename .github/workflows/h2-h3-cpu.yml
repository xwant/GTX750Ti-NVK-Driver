name: H2 H3 CPU and compiler validation
on:
  push:
    branches: ['experiment/h3-shader-telemetry']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xwant/GTX750Ti-NVK-Driver
          ref: 8c77906e43095d1cce790fd96cd97a6199d0fd36
          path: _audit
      - run: |
          python3 -m unittest discover -s h3/tests -v
          python3 -m unittest discover -s h3 -p test_autotune.py -v
          python3 -m unittest discover -s _audit/bench/h2 -p 'test_*.py' -v
          python3 -O -m unittest discover -s h3/tests -v
          python3 -O -m unittest discover -s _audit/bench/h2 -p 'test_*.py' -v
          bash -n ci/build_mesa.sh build-h3-cachyos.sh
  compiler:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, h2, h3, h2-h3]
    steps:
      - name: Development dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential pkg-config python3 python3-pip python3-venv python3-mako python3-ply python3-yaml meson ninja-build rustc cargo bindgen cbindgen bison flex libdrm-dev libelf-dev libudev-dev libzstd-dev libexpat1-dev zlib1g-dev clang-19 libclang-19-dev libclang-cpp19-dev llvm-19-dev libllvmspirvlib-19-dev libclc-19-dev libclc-19 spirv-tools
          python3 -m venv --system-site-packages /tmp/meson
          /tmp/meson/bin/pip install meson==1.9.1
          echo /tmp/meson/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xwant/GTX750Ti-NVK-Driver
          ref: 8c77906e43095d1cce790fd96cd97a6199d0fd36
          path: _audit
      - name: Build and test without GPU
        env:
          GM107_JOBS: '2'
        run: bash ci/build_mesa.sh '${{ matrix.variant }}' "$GITHUB_WORKSPACE/_build" "$GITHUB_WORKSPACE/_audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-${{ matrix.variant }}
          path: |
            _build/*.txt
            _build/*.stderr
            _build/*.json
            _build/*.sha256
            _build/build/meson-logs/testlog.*
          if-no-files-found: warn
  codegen-regression:
    needs: compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cpu-*
          path: artifacts
      - name: Compare exact machine code across unpatched and diagnostic builds
        run: |
          cmp artifacts/cpu-base/codegen-off.txt artifacts/cpu-h3/codegen-off.txt
          cmp artifacts/cpu-h2/codegen-off.txt artifacts/cpu-h2-h3/codegen-off.txt
          cmp artifacts/cpu-h2/codegen-policy-on.txt artifacts/cpu-h2-h3/codegen-policy-on.txt
          cmp artifacts/cpu-h2-h3/codegen-policy-on.txt artifacts/cpu-h2-h3/codegen-policy-diag.txt
          cmp artifacts/cpu-h3/codegen-off.txt artifacts/cpu-h3/codegen-on.txt
          cmp artifacts/cpu-h2-h3/codegen-off.txt artifacts/cpu-h2-h3/codegen-on.txt
          echo 'Compiler fixtures only. Hardware validation NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
